name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Python version
        run: python3 --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build packaged app and run smoke test
        run: ./build-app.sh --smoke-test
